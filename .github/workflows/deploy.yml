name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to build and deploy (default: git SHA)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write   # required for WIF

env:
  GCP_PROJECT_ID: civicmirror-2026
  GCP_REGION: us-central1
  AR_REPO: civicmirror-images
  AR_BASE: us-central1-docker.pkg.dev/civicmirror-2026/civicmirror-images

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.AR_BASE }}/backend:${{ steps.tag.outputs.tag }}
            ${{ env.AR_BASE }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Deploy backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: civicmirror-backend
          image: ${{ env.AR_BASE }}/backend:${{ steps.tag.outputs.tag }}
          region: ${{ env.GCP_REGION }}

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.AR_BASE }}/frontend:${{ steps.tag.outputs.tag }}
            ${{ env.AR_BASE }}/frontend:latest
          build-args: |
            VITE_API_URL=https://api.civicmirror.welshrd.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: civicmirror-frontend
          image: ${{ env.AR_BASE }}/frontend:${{ steps.tag.outputs.tag }}
          region: ${{ env.GCP_REGION }}

      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ CivicMirror Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`${{ steps.tag.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **App** | https://civicmirror.welshrd.com |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **API** | https://api.civicmirror.welshrd.com |" >> "$GITHUB_STEP_SUMMARY"
